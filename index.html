<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Push & Pull Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- User picker overlay -->
  <div id="user-picker" class="user-picker hidden">
    <div class="user-picker-card">
      <h2>Who are you?</h2>
      <div id="user-picker-buttons" class="user-picker-buttons">
        <!-- populated by JS from sheet headers -->
      </div>
      <div id="add-user-form" class="add-user-form hidden">
        <input id="new-user-name" type="text" placeholder="Enter name" maxlength="30"
               onkeydown="if(event.key==='Enter')confirmAddUser()" />
        <div class="add-user-actions">
          <button class="btn btn-ghost btn-sm" onclick="hideAddUserForm()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="confirmAddUser()">Add</button>
        </div>
      </div>
    </div>
  </div>

  <header>
    <div class="header-inner">
      <div class="header-title">
        <h1>100 Rep Challenge</h1>
      </div>
      <div class="header-actions">
        <span id="user-label" class="user-label hidden"></span>
        <button id="auth-btn" class="btn btn-ghost hidden" onclick="switchUser()">Switch User</button>
      </div>
    </div>
  </header>

  <main>
     <!-- Log today -->
    <section id="log-today-section" class="hidden">
      <div id="log-today-card" class="log-today-card"></div>
    </section>

    <!-- Summary bar -->
    <section id="summary-section" class="summary-section hidden">
      <div id="summary-grid" class="summary-grid">
        <!-- populated by JS from sheet headers -->
      </div>
    </section>

    <!-- Week blocks -->
    <section id="weeks-section" class="weeks-section hidden">
      <div id="weeks-container"></div>
    </section>

    <!-- Empty / not signed in state -->
    <section id="empty-state" class="empty-state">
      <div class="empty-icon">💪</div>
      <h2>Track your reps</h2>
      <p>Select your name above to get started.</p>
    </section>
  </main>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Loading overlay -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
